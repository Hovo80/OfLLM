[package]
name = "gl4-core-public"
version = "0.2.0"
edition = "2021"
description = "Production-ready 4-bit LUT core - 8x less ZK constraints than fp32, 4.2x faster than int8"
license-file = "LICENSE"
repository = "https://github.com/Hovo80/OfLLM"
keywords = ["zkml", "quantization", "arm", "edge-ai", "fixed-point"]
readme = "README.md"
authors = ["Hovhannes Martirosyan (Hovo80)"]

[lib]
name = "gl4_core_public"
path = "src/lib.rs"

[[bench]]
name = "gl4_bench"
harness = false
path = "benches/gl4_bench.rs"

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = ["std"]
std = []
neon = []
avx2 = []