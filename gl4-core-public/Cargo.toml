[package]
name = "gl4-core-public"
version = "0.2.0"
edition = "2021"
description = "GL4 Core v0.2.0 - 36x vs fp32 - 1.36ns/lookup LUT, 689us FixedI16 mul, ZK 1 constraint vs 8 fp32"
license-file = "LICENSE"
repository = "https://github.com/Hovo80/OfLLM"
keywords = ["gl4", "quaternary-logic", "zkml", "quantization", "fixed-point"]
readme = "README.md"
authors = ["Hovhannes Martirosyan (Hovo80) - Gayane Soft - GL4 Gayane Quaternary Logic"]

[lib]
name = "gl4_core_public"
path = "src/lib.rs"

[[bench]]
name = "gl4_bench"
harness = false
path = "benches/gl4_bench.rs"

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = ["std"]
std = []
neon = []
avx2 = []
